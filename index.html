<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScreenMirror Receiver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: sans-serif; }

    #canvas { width: 100%; height: 100%; object-fit: contain; display: none; }
    #video  { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
    #image  { width: 100%; height: 100%; object-fit: contain; display: none; }

    /* ── Idle / connecting screen ── */
    #idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at center, #111 0%, #000 70%);
    }

    #idle img.logo {
      width: 160px;
      height: 160px;
      object-fit: contain;
      border-radius: 32px;
      margin-bottom: 32px;
      opacity: 0.95;
    }

    #idle h1 {
      font-size: 52px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    #idle p {
      font-size: 24px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 48px;
    }

    /* connecting pill shown while waiting for stream */
    #connecting {
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 12px 24px;
    }

    #connecting.visible { display: flex; }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #connecting span {
      font-size: 18px;
      color: rgba(255,255,255,0.55);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Idle/connecting splash -->
  <div id="idle">
    <!-- Replace this src with your actual logo URL on GitHub Pages e.g. ./logo.png -->
    <img class="logo" src="./logo.png" onerror="this.style.display='none'" />
    <h1>Mirror &amp; Casting</h1>
    <p>Open the app on your phone to get started</p>
    <div id="connecting">
      <div class="spinner"></div>
      <span id="connecting-text">Connecting…</span>
    </div>
  </div>

  <canvas id="canvas"></canvas>
  <video  id="video" autoplay playsinline></video>
  <img    id="image" />

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const canvas   = document.getElementById('canvas');
    const ctx2d    = canvas.getContext('2d');
    const video    = document.getElementById('video');
    const image    = document.getElementById('image');
    const idle     = document.getElementById('idle');
    const connecting = document.getElementById('connecting');
    const connectingText = document.getElementById('connecting-text');

    let wsUrl = null;
    let ws    = null;
    let frameCount = 0;

    canvas.width  = window.screen.width  || 1920;
    canvas.height = window.screen.height || 1080;

    function showOnly(el) {
      idle.style.display   = 'none';
      canvas.style.display = 'none';
      video.style.display  = 'none';
      image.style.display  = 'none';
      el.style.display     = 'block';
    }

    function showIdle(msg) {
      idle.style.display = 'flex';
      canvas.style.display = 'none';
      video.style.display  = 'none';
      image.style.display  = 'none';
      if (msg) {
        connecting.classList.add('visible');
        connectingText.textContent = msg;
      } else {
        connecting.classList.remove('visible');
      }
    }

    // ── WebSocket mirror mode ────────────────────────────────────────────────
    function connectWebSocket(url) {
      wsUrl = url;
      showIdle('Connecting to your phone…');

      ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        console.log('WS connected');
        // Hide idle as soon as first frame arrives, not on open
      };

      ws.onmessage = (event) => {
        // First frame — switch to canvas
        if (idle.style.display !== 'none') { showOnly(canvas); }
        const blob = new Blob([event.data], { type: 'image/jpeg' });
        const burl = URL.createObjectURL(blob);
        const img  = new Image();
        img.onload = () => {
          canvas.width  = img.width;
          canvas.height = img.height;
          ctx2d.drawImage(img, 0, 0);
          URL.revokeObjectURL(burl);
          frameCount++;
        };
        img.src = burl;
      };

      ws.onerror  = (e) => { console.error('WS error', e); };
      ws.onclose  = () => {
        console.log('WS closed');
        showIdle('Connection lost — reconnecting…');
        setTimeout(() => { if (wsUrl) connectWebSocket(wsUrl); }, 1000);
      };
    }

    // ── Image display ────────────────────────────────────────────────────────
    function displayImage(url) {
      showOnly(image);
      image.src = url;
      image.onerror = () => console.error('Image load error:', url);
    }

    // ── Cast SDK ─────────────────────────────────────────────────────────────
    const castCtx = cast.framework.CastReceiverContext.getInstance();
    const pm = castCtx.getPlayerManager();

    pm.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (request) => {
        const url         = (request.media && request.media.contentUrl) || '';
        const contentType = (request.media && request.media.contentType) || '';
        console.log('LOAD — url:', url, 'type:', contentType);

        if (url.startsWith('ws://') || url.startsWith('wss://')) {
          connectWebSocket(url);
          return null;
        } else if (contentType.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|heic)$/i.test(url)) {
          displayImage(url);
          return null;
        } else if (contentType.startsWith('video/') || /\.(mp4|mov|m4v|webm)$/i.test(url)) {
          showOnly(video);
          return request;
        } else {
          return request;
        }
      }
    );

    // Return to idle splash when session ends
    castCtx.addEventListener(
      cast.framework.system.EventType.SHUTDOWN,
      () => showIdle(null)
    );

    castCtx.start({ maxInactivity: 3600 });
  </script>
</body>
</html>
