<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScreenMirror Receiver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
    canvas { width: 100%; height: 100%; object-fit: contain; }
    #status {
      position: absolute; top: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-family: sans-serif; font-size: 18px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="status">Waiting for stream...</div>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <script>
    const canvas = document.getElementById('c');
    const ctx2d  = canvas.getContext('2d');
    const status = document.getElementById('status');

    let wsUrl = null;
    let ws    = null;
    let frameCount = 0;
    let lastFrameTime = 0;

    // Resize canvas to screen
    canvas.width  = window.screen.width  || 1920;
    canvas.height = window.screen.height || 1080;

    // ── WebSocket ────────────────────────────────────────────────────────────
    function connectWebSocket(url) {
      wsUrl = url;
      status.textContent = 'Connecting...';
      ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        status.textContent = '';
        console.log('WS connected');
      };

      ws.onmessage = (event) => {
        // Each message is a JPEG frame
        const blob = new Blob([event.data], { type: 'image/jpeg' });
        const url  = URL.createObjectURL(blob);
        const img  = new Image();
        img.onload = () => {
          canvas.width  = img.width;
          canvas.height = img.height;
          ctx2d.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          frameCount++;
          const now = performance.now();
          if (frameCount % 30 === 0) {
            const fps = Math.round(30000 / (now - lastFrameTime));
            status.textContent = fps + ' fps';
            lastFrameTime = now;
          }
        };
        img.src = url;
      };

      ws.onerror = (e) => {
        console.error('WS error', e);
        status.textContent = 'Error';
      };

      ws.onclose = () => {
        status.textContent = 'Reconnecting...';
        setTimeout(() => { if (wsUrl) connectWebSocket(wsUrl); }, 500);
      };
    }

    // ── Cast SDK ─────────────────────────────────────────────────────────────
    const castCtx = cast.framework.CastReceiverContext.getInstance();
    const pm = castCtx.getPlayerManager();

    pm.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (request) => {
        const url = (request.media && request.media.contentUrl) || '';
        console.log('LOAD:', url);
        if (url.startsWith('ws://') || url.startsWith('wss://')) {
          connectWebSocket(url);
          return null; // handle ourselves
        }
        return request;
      }
    );

    castCtx.start({ maxInactivity: 3600 });
  </script>
</body>
</html>
