<!DOCTYPE html>
<html>
<head>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="margin:0;background:#000;">
  <video id="vid" style="width:100%;height:100vh;" autoplay playsinline></video>
<script>
    const ctx = cast.framework.CastReceiverContext.getInstance();
    const pm = ctx.getPlayerManager();
    pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, req => {
      const url = req.media.contentUrl || req.media.contentId;
      const video = document.getElementById('vid');
      if (Hls.isSupported()) {
        const hls = new Hls({
            liveSyncDurationCount: 0,
            liveMaxLatencyDurationCount: 1,
            maxBufferLength: 0.5,
            maxMaxBufferLength: 1,
            lowLatencyMode: true,
        });
        hls.loadSource(url);
        hls.attachMedia(video);
      }
      return null;
    });
    ctx.start();
</script>
</body>
</html>
