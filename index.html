<!DOCTYPE html>
<html>
<head>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="margin:0;background:#000;">
  <video id="vid" style="width:100%;height:100vh;" autoplay playsinline></video>
  <script>
    const ctx = cast.framework.CastReceiverContext.getInstance();
    const pm = ctx.getPlayerManager();
    pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, req => {
      const url = req.media.contentUrl || req.media.contentId;
      console.log('Loading URL:', url);
      const video = document.getElementById('vid');
      if (Hls.isSupported()) {
        const hls = new Hls({ debug: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error('HLS error:', data);
        });
      }
      return null; // Return null to prevent default handling
    });
    ctx.start();
  </script>
</body>
</html>
