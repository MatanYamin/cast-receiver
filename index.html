<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mirror & Casting</title>
  <style>
    @font-face {
      font-family: 'Croogla';
      src: url('./Croogla4F.ttf') format('truetype');
      font-weight: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Croogla', sans-serif;
    }

    #canvas { width: 100%; height: 100%; object-fit: contain; display: none; }
    #video  { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
    #image  { width: 100%; height: 100%; object-fit: contain; display: none; }

    /* ── Idle splash ── */
    #idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: #000;
      position: relative;
    }

    /* Dark grey radial gradient */
    #idle::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 45%, rgba(60,60,60,0.45) 0%, rgba(0,0,0,0) 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle diagonal stripes on top */
    #idle::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 24px,
        rgba(255,255,255,0.022) 24px,
        rgba(255,255,255,0.022) 25px
      );
      pointer-events: none;
      z-index: 0;
    }

    .glow {
      position: absolute;
      width: 600px;
      height: 400px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -55%);
      background: radial-gradient(ellipse, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(30px);
    }

        .idle-inner {
      position: relative;
      z-index: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    #idle img.logo {
      width: 220px;
      object-fit: contain;
      margin-bottom: 8px;
      /* No border-radius since logo has its own black bg */
      filter: drop-shadow(0 0 30px rgba(0, 220, 200, 0.25));
    }

    /* Divider line */
    .divider {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.15), transparent);
      margin: 20px 0;
    }

    #idle h1 {
      font-family: 'Croogla', sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1.5px;
      margin-bottom: 12px;
      /* Subtle gradient on text */
      background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #idle p {
      font-size: 22px;
      font-weight: 400;
      color: rgba(255,255,255,0.28);
      margin-bottom: 52px;
      letter-spacing: 0.2px;
    }

    /* Connecting pill */
    #connecting {
      display: none;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 100px;
      padding: 14px 28px;
      backdrop-filter: blur(10px);
    }
    #connecting.visible { display: flex; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: rgba(0, 220, 200, 0.8);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    #connecting span {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.2px;
    }

    /* Bottom watermark */
    .watermark {
      position: absolute;
      bottom: 32px;
      font-size: 14px;
      color: rgba(255,255,255,0.1);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="idle">
    <div class="idle-inner">
      <div class="glow"></div>
      <img class="logo" src="./logo.png" onerror="this.style.display='none'" />
      <div class="divider"></div>
      <h1>Mirror &amp; Casting</h1>
      <p>Your screen, on the big screen</p>
      <div id="connecting">
        <div class="spinner"></div>
        <span id="connecting-text">Connecting…</span>
      </div>
    </div>

  </div>

  <canvas id="canvas"></canvas>
  <video  id="video" autoplay playsinline></video>
  <img    id="image" />

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const canvas         = document.getElementById('canvas');
    const ctx2d          = canvas.getContext('2d');
    const video          = document.getElementById('video');
    const image          = document.getElementById('image');
    const idle           = document.getElementById('idle');
    const connecting     = document.getElementById('connecting');
    const connectingText = document.getElementById('connecting-text');

    let wsUrl = null;
    let ws    = null;

    canvas.width  = window.screen.width  || 1920;
    canvas.height = window.screen.height || 1080;

    function showOnly(el) {
      idle.style.display   = 'none';
      canvas.style.display = 'none';
      video.style.display  = 'none';
      image.style.display  = 'none';
      el.style.display     = 'block';
    }

    function showIdle(msg) {
      idle.style.display   = 'flex';
      canvas.style.display = 'none';
      video.style.display  = 'none';
      image.style.display  = 'none';
      if (msg) {
        connecting.classList.add('visible');
        connectingText.textContent = msg;
      } else {
        connecting.classList.remove('visible');
      }
    }

    // ── WebSocket mirror ─────────────────────────────────────────────────────
    function connectWebSocket(url) {
      wsUrl = url;
      showIdle('Connecting to your phone…');
      ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => console.log('WS connected');
      ws.onmessage = (event) => {
        if (idle.style.display !== 'none') showOnly(canvas);
        const blob = new Blob([event.data], { type: 'image/jpeg' });
        const burl = URL.createObjectURL(blob);
        const img  = new Image();
        img.onload = () => {
          canvas.width  = img.width;
          canvas.height = img.height;
          ctx2d.drawImage(img, 0, 0);
          URL.revokeObjectURL(burl);
        };
        img.src = burl;
      };
      ws.onerror = (e) => console.error('WS error', e);
      ws.onclose = () => {
        showIdle('Connection lost — reconnecting…');
        setTimeout(() => { if (wsUrl) connectWebSocket(wsUrl); }, 1000);
      };
    }

    // ── Image ────────────────────────────────────────────────────────────────
    function displayImage(url) {
      showOnly(image);
      image.src = url;
    }

    // ── Cast SDK ─────────────────────────────────────────────────────────────
    const castCtx = cast.framework.CastReceiverContext.getInstance();
    const pm = castCtx.getPlayerManager();

    pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
      const url         = (request.media && request.media.contentUrl) || '';
      const contentType = (request.media && request.media.contentType) || '';

      if (url.startsWith('ws://') || url.startsWith('wss://')) {
        connectWebSocket(url);
        return null;
      } else if (contentType.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|heic)$/i.test(url)) {
        displayImage(url);
        return null;
      } else if (contentType.startsWith('video/') || /\.(mp4|mov|m4v|webm)$/i.test(url)) {
        showOnly(video);
        return request;
      }
      return request;
    });

    castCtx.addEventListener(cast.framework.system.EventType.SHUTDOWN, () => showIdle(null));
    castCtx.start({ maxInactivity: 3600 });
  </script>
</body>
</html>
