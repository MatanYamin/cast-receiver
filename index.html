<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mirror & Casting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
    }
    #canvas { width: 100%; height: 100%; object-fit: contain; display: none; }
    #video  { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
    #image  { width: 100%; height: 100%; object-fit: contain; display: none; }
    #idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    #idle img.logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 8px;
      opacity: 0.7;
    }
    #idle p {
      font-size: 16px;
      font-weight: 400;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.2px;
    }
    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      color: rgba(255,255,0,0.7);
      font-size: 11px;
      font-family: monospace;
      pointer-events: none;
      z-index: 9999;
      max-height: 120px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="idle">
    <img class="logo" src="./logo.png" onerror="this.style.display='none'" />
    <p>Ready to mirror</p>
  </div>

  <canvas id="canvas"></canvas>
  <video  id="video" autoplay playsinline></video>
  <img    id="image" />
  <div    id="debug"></div>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    // ── Debug logger (shows on screen + console) ─────────────────────────────
    const debugEl = document.getElementById('debug');
    const logLines = [];
    function log(...args) {
      const msg = args.join(' ');
      console.log('[MIRROR]', msg);
      logLines.push(msg);
      if (logLines.length > 8) logLines.shift();
      debugEl.innerText = logLines.join('\n');
    }

    // ── Elements ─────────────────────────────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const ctx2d  = canvas.getContext('2d');
    const video  = document.getElementById('video');
    const image  = document.getElementById('image');
    const idle   = document.getElementById('idle');

    canvas.width  = window.screen.width  || 1920;
    canvas.height = window.screen.height || 1080;
    log('Screen:', canvas.width, 'x', canvas.height);

    let wsUrl          = null;
    let ws             = null;
    let reconnectTimer = null;
    let frameCount     = 0;
    let lastFpsLog     = Date.now();

    // ── Show/hide helpers ─────────────────────────────────────────────────────
    function showOnly(el) {
      idle.style.display   = 'none';
      canvas.style.display = 'none';
      video.style.display  = 'none';
      image.style.display  = 'none';
      el.style.display     = 'block';
      log('Showing:', el.id);
    }
    function showIdle() {
      idle.style.display   = 'flex';
      canvas.style.display = 'none';
      video.style.display  = 'none';
      image.style.display  = 'none';
      log('Showing: idle');
    }

    // ── WebSocket mirror ──────────────────────────────────────────────────────
    function connectWebSocket(url) {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

      if (ws) {
        ws.onclose = null;
        ws.onerror = null;
        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
          ws.close();
        }
        ws = null;
      }

      wsUrl = url;
      log('WS connecting to:', url);
      showIdle();

      const newWs = new WebSocket(url);
      ws = newWs;
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        log('WS open — showing canvas');
        showOnly(canvas);
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        frameCount = 0;
        lastFpsLog = Date.now();
      };

      ws.onmessage = async (event) => {
        frameCount++;
        // Log FPS every 5 seconds
        const now = Date.now();
        if (now - lastFpsLog >= 5000) {
          const fps = (frameCount / ((now - lastFpsLog) / 1000)).toFixed(1);
          log('FPS:', fps, '| frames:', frameCount, '| bytes last:', event.data.byteLength);
          frameCount = 0;
          lastFpsLog = now;
        }

        try {
          const bitmap = await createImageBitmap(
            new Blob([event.data], { type: 'image/jpeg' })
          );
          if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
            log('Canvas resize:', bitmap.width, 'x', bitmap.height);
            canvas.width  = bitmap.width;
            canvas.height = bitmap.height;
          }
          ctx2d.drawImage(bitmap, 0, 0);
          bitmap.close();
        } catch (e) {
          log('Frame error:', e.message);
        }
      };

      ws.onerror = (e) => log('WS error:', e.type);

      ws.onclose = (e) => {
        if (ws !== newWs) return;
        log('WS closed, code:', e.code, '— reconnecting in 1.5s');
        showIdle();
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          if (wsUrl) connectWebSocket(wsUrl);
        }, 1500);
      };
    }

    // ── Image display ─────────────────────────────────────────────────────────
    function displayImage(url) {
      log('Displaying image:', url);
      showOnly(image);
      image.src = url;
    }

    // ── Cast SDK ──────────────────────────────────────────────────────────────
    const castCtx = cast.framework.CastReceiverContext.getInstance();
    const pm = castCtx.getPlayerManager();

    pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
      const url         = (request.media && request.media.contentUrl) || '';
      const contentType = (request.media && request.media.contentType) || '';
      log('LOAD intercepted:', contentType, url.substring(0, 60));

      if (url.startsWith('ws://') || url.startsWith('wss://')) {
        connectWebSocket(url);
        return null;
      } else if (contentType.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|heic)$/i.test(url)) {
        displayImage(url);
        return null;
      } else if (contentType.startsWith('video/') || /\.(mp4|mov|m4v|webm)$/i.test(url)) {
        showOnly(video);
        return request;
      }
      return request;
    });

    castCtx.addEventListener(cast.framework.system.EventType.SHUTDOWN, () => {
      log('Cast shutdown event');
      showIdle();
    });

    log('Cast receiver starting...');
    castCtx.start({ maxInactivity: 3600 });
    log('Cast receiver started');
  </script>
</body>
</html>
