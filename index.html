<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mirror & Casting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
    }

    #canvas { width: 100%; height: 100%; object-fit: contain; display: none; }
    #video  { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
    #image  { width: 100%; height: 100%; object-fit: contain; display: none; }

    #idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #idle img.logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 8px;
      opacity: 0.7;
    }

    #idle p {
      font-size: 16px;
      font-weight: 400;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div id="idle">
    <img class="logo" src="./logo.png" onerror="this.style.display='none'" />
    <p>Ready to mirror</p>
  </div>

  <canvas id="canvas"></canvas>
  <video  id="video" autoplay playsinline></video>
  <img    id="image" />

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const canvas         = document.getElementById('canvas');
    const ctx2d          = canvas.getContext('2d');
    const video          = document.getElementById('video');
    const image          = document.getElementById('image');
    const idle           = document.getElementById('idle');

    let wsUrl        = null;
    let ws           = null;
    let wsConnecting = false;  // guard against duplicate connections
    let reconnectTimer = null;

    canvas.width  = window.screen.width  || 1920;
    canvas.height = window.screen.height || 1080;

    // Reuse a single Image object to avoid GC pressure at 30fps
    const frameImg = new Image();
    let   pendingBurl = null;
    frameImg.onload = () => {
      if (canvas.width !== frameImg.width || canvas.height !== frameImg.height) {
        canvas.width  = frameImg.width;
        canvas.height = frameImg.height;
      }
      ctx2d.drawImage(frameImg, 0, 0);
      if (pendingBurl) { URL.revokeObjectURL(pendingBurl); pendingBurl = null; }
    };

    function showOnly(el) {
      idle.style.display   = 'none';
      canvas.style.display = 'none';
      video.style.display  = 'none';
      image.style.display  = 'none';
      el.style.display     = 'block';
    }

    function showIdle() {
      idle.style.display   = 'flex';
      canvas.style.display = 'none';
      video.style.display  = 'none';
      image.style.display  = 'none';
    }

    // ── WebSocket mirror ─────────────────────────────────────────────────────
    function connectWebSocket(url) {
      // Cancel any pending reconnect
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

      // Close existing socket cleanly before opening a new one
      if (ws) {
        ws.onclose = null;  // prevent onclose from triggering another reconnect
        ws.onerror = null;
        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
          ws.close();
        }
        ws = null;
      }

      wsUrl = url;
      wsConnecting = true;
      showIdle();

      const newWs = new WebSocket(url);
      ws = newWs;
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        wsConnecting = false;
        console.log('WS connected');
        // Don't show canvas yet — wait for first real frame so TV never sees black
      };

      ws.onmessage = (event) => {
        // Switch to canvas on first frame arrival (check computed style, not inline)
        if (getComputedStyle(canvas).display === 'none') showOnly(canvas);
        // Revoke previous URL if still pending
        if (pendingBurl) { URL.revokeObjectURL(pendingBurl); }
        const blob  = new Blob([event.data], { type: 'image/jpeg' });
        pendingBurl = URL.createObjectURL(blob);
        frameImg.src = pendingBurl;
      };

      ws.onerror = (e) => console.error('WS error', e);

      ws.onclose = () => {
        if (ws !== newWs) return;  // stale socket, ignore
        wsConnecting = false;
        showIdle();
        // Try to reconnect after 1.5s
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          if (wsUrl) connectWebSocket(wsUrl);
        }, 1500);
        // If still no connection after 8s, assume sender stopped intentionally
        // and shut down the cast app so the TV returns to its home screen
        setTimeout(() => {
          if (wsUrl && (!ws || ws.readyState !== WebSocket.OPEN)) {
            console.log('WS gone for 8s — stopping cast app');
            cast.framework.CastReceiverContext.getInstance().stop();
          }
        }, 8000);
      };
    }

    // ── Image ────────────────────────────────────────────────────────────────
    function displayImage(url) {
      showOnly(image);
      image.src = url;
    }

    // ── Cast SDK ─────────────────────────────────────────────────────────────
    const castCtx = cast.framework.CastReceiverContext.getInstance();
    const pm = castCtx.getPlayerManager();

    pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
      const url         = (request.media && request.media.contentUrl) || '';
      const contentType = (request.media && request.media.contentType) || '';

      if (url.startsWith('ws://') || url.startsWith('wss://')) {
        connectWebSocket(url);
        return null;
      } else if (contentType.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|heic)$/i.test(url)) {
        displayImage(url);
        return null;
      } else if (contentType.startsWith('video/') || /\.(mp4|mov|m4v|webm)$/i.test(url)) {
        showOnly(video);
        return request;
      }
      return request;
    });

    castCtx.addEventListener(cast.framework.system.EventType.SHUTDOWN, () => showIdle());
    castCtx.start({ maxInactivity: 3600 });
  </script>
</body>
</html>
